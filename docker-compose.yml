version: '3.8'

# ═══════════════════════════════════════════════════════════════
# yDB Docker Compose
#
# REQUIRED: Set these environment variables before running:
#   JWT_SECRET      — minimum 32 characters (generate with: openssl rand -hex 64)
#   ENCRYPTION_KEY  — exactly 32 characters (generate with: openssl rand -hex 16)
#   PG_PASSWORD     — strong database password
#
# Example:
#   JWT_SECRET=$(openssl rand -hex 64) \
#   ENCRYPTION_KEY=$(openssl rand -hex 16) \
#   PG_PASSWORD=$(openssl rand -base64 24) \
#   docker compose up -d
# ═══════════════════════════════════════════════════════════════

services:
  # ── yDB App Server ───────────────────────────────────────
  ydb:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (generate with openssl rand -hex 64)}"
      - JWT_EXPIRES_IN=7d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-}
      - NLQ_PROVIDER=${NLQ_PROVIDER:-builtin}
      - NLQ_MODEL=${NLQ_MODEL:-}
      - NLQ_REGION=${NLQ_REGION:-us-east-1}
      - NLQ_API_KEY=${NLQ_API_KEY:-}
      - YDB_BLOCK_PRIVATE_HOSTS=${YDB_BLOCK_PRIVATE_HOSTS:-false}
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=ydb
      - PG_PASSWORD=${PG_PASSWORD:?PG_PASSWORD is required}
      - PG_DATABASE=ydb_app
      - "ENCRYPTION_KEY=${ENCRYPTION_KEY:?ENCRYPTION_KEY is required (generate with openssl rand -hex 16)}"
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=info
      - BACKUP_TARGET=${BACKUP_TARGET:-local}
      - BACKUP_INTERVAL_HOURS=${BACKUP_INTERVAL_HOURS:-6}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-10}
      - RATE_LIMIT_QUERY=${RATE_LIMIT_QUERY:-200}
      - RATE_LIMIT_GENERAL=${RATE_LIMIT_GENERAL:-500}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups

  # ── PostgreSQL (App Database) ────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ydb
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      POSTGRES_DB: ydb_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No host port published: only the app container needs the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ydb"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Redis (Cache, Queue, Sessions) ──────────────────────
  redis:
    image: redis:7-alpine
    # No host port published: only the app container needs Redis.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
