<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Cyan to Purple Gradient Matching Logo -->
    <linearGradient id="ydb-wave-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#3A7BD5" />
    </linearGradient>
    <linearGradient id="ydb-wave-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7BD5" />
      <stop offset="50%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#E100FF" />
    </linearGradient>
  </defs>

  <!-- Dark Slate Background Box -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>

  <!-- Dynamic Y Wave Mark -->
  <g transform="translate(60, 60) scale(1.53)">
    <!-- Left Branch Stem -->
    <path d="M 50 50 C 70 80, 100 120, 110 140 C 100 160, 70 180, 30 200 C 70 190, 115 160, 130 130 Z" fill="url(#ydb-wave-1)" />
    
    <!-- Flowing Right Wave Arm -->
    <path d="M 120 50 C 135 80, 160 110, 210 50 C 160 100, 130 150, 60 210 C 120 180, 160 130, 220 55 C 180 110, 140 160, 120 50 Z" fill="url(#ydb-wave-2)" />
  </g>
</svg>
