name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ydb
          POSTGRES_PASSWORD: ydb_ci_secret_password
          POSTGRES_DB: ydb_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ydb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: ./server
        run: npm ci --ignore-scripts 2>&1 | tail -5

      - name: Run unit tests
        working-directory: ./server
        env:
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
          ENCRYPTION_KEY: "12345678901234567890123456789012"
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: ydb
          PG_PASSWORD: ydb_ci_secret_password
          PG_DATABASE: ydb_app
          NODE_ENV: test
        run: npm run test:ci

      - name: Initialize database
        working-directory: ./server
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: ydb
          PG_PASSWORD: ydb_ci_secret_password
          PG_DATABASE: ydb_app
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
          ENCRYPTION_KEY: "12345678901234567890123456789012"
        run: node db/init.js

      - name: Verify server starts
        working-directory: ./server
        env:
          PG_HOST: localhost
          PG_PORT: "5432"
          PG_USER: ydb
          PG_PASSWORD: ydb_ci_secret_password
          PG_DATABASE: ydb_app
          JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
          ENCRYPTION_KEY: "12345678901234567890123456789012"
          PORT: "3000"
        run: |
          node server.js &
          sleep 3
          curl -sf http://localhost:3000/metrics > /dev/null && echo "Health check passed" || exit 1
          kill %1

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ydb:test .
